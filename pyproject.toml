[project]
name = "user-bot"
version = "0.1.0"
description = ""
authors = [{ name = "Dmitry Vargin" }]
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "advanced-alchemy>=1.11.0",
    "aiofiles>=25.1.0",
    "aiogram>=3.30.0",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "colorama>=0.4.6",
    "coloredlogs>=15.0.1",
    "dishka>=1.10.1",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "google-genai>=2.17.0",
    "hf-xet>=1.6.0",
    "instagrapi>=2.18.12",
    "openai>=2.53.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
    "telethon>=1.44.0",
    "tgcrypto>=1.2.5",
    "uuid-utils>=0.17.0",
]

[project.optional-dependencies]
lint = [
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "types-aiofiles>=25.1.0.20260518",
]
dev = [
    "notebook>=7.6.1",
    "ipykernel>=7.3.0",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
line_length = 120
order_by_type = false
combine_as_imports = true

[tool.ruff]
lint.extend-ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/migrations/env.py" = ["E402"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src", "."]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
    "**/.[!/.]*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
pythonpath =[
    ".", "src",
]
