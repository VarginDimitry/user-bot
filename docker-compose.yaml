services:
  user-bot:
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-bot
    env_file:
      - .env
    environment:
      OPENAI__BASE_URL: http://gemini-webapi-proxy:4982/openai/v1
      POSTGRES__DNS: postgresql+asyncpg://usrbot:usrbot@postgres:5432/usrbot
    restart: always
    volumes:
      - ./src:/app
    networks:
      - usrbot-network
    depends_on:
      - postgres
      - gemini-webapi-proxy

  postgres:
    image: postgres:latest
    container_name: usrbot-postgres
    environment:
      POSTGRES_USER: usrbot
      POSTGRES_PASSWORD: usrbot
      POSTGRES_DB: usrbot
    ports:
      - "5131:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - usrbot-network

  gemini-webapi-proxy:
    image: ghcr.io/lutiancheng1/gemini-webapi-proxy:latest
    container_name: gemini-webapi-proxy
    env_file:
      - .env
    environment:
      GOP_PORT: "4982"
      GOP_HOST: "0.0.0.0"
      GOP_COOKIE_SOURCE: env
      GOP_PROBE_ON_START: "false"
      GOP_LOG_FORMAT: json
      GOP_GEMINI_1PSID: ${GOP_GEMINI_1PSID}
      GOP_GEMINI_1PSIDTS: ${GOP_GEMINI_1PSIDTS}
    ports:
      - "4982:4982"
    restart: always
    volumes:
      - gemini-proxy-data:/app/data
    networks:
      - usrbot-network
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4982/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s

networks:
  usrbot-network:
    external: true

volumes:
  pgdata:
  gemini-proxy-data:
